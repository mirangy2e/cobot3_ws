# M0609 + RG2 + D455 pick and place 설정값 (이 폴더의 모든 실행 파일이 공유)
# 코드에서는 import m0609_settings as settings 후 settings.<대문자 키> 로 읽는다. 예) target_step -> settings.TARGET_STEP (m0609_settings.py 참고)

# ===================================================================
# [수정 금지 영역]
# 스크립트 시작 시 장면과 IK 를 만드는 데 한 번만 쓰인다.
# 실행 중에 바꿔도 반영되지 않으며, 바꾸려면 스크립트를 다시 실행해야 한다.
# ===================================================================

# ---- 파일 경로 (이 yaml 파일 기준 상대 경로) ----
robot_usd: ../robot/m0609_rg2_d455.usd               # 로봇 USD: M0609 + RG2 그리퍼 + RealSense D455 카메라
urdf_path: ../robot/m0609_rg2.urdf                   # Lula(IK / trajectory / RRT) 계산용 URDF
robot_description_path: ../descriptor/m0609_robot_description.yaml   # Lula 로봇 설명 파일 (관절, 기본 자세, 충돌 구)
rrt_config_path: ../descriptor/m0609_rrt_config.yaml # Lula RRT 설정 파일 (run_pick_place_rrt.py 에서만 사용)

# ---- 장면 안의 prim 경로 ----
robot_prim_path: /World/m0609_rg2_d455               # 로봇을 놓을 경로
end_effector_prim_path: /World/m0609_rg2_d455/gripper_body   # 그리퍼 본체 (rigid body 여야 함)

# ---- 관절과 기준 프레임 ----
arm_joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]   # 팔 관절 6개
gripper_joint: finger_joint        # 그리퍼 구동 관절 (나머지 손가락 관절은 USD 의 mimic 관절이 따라감)
tcp_frame: gripper_center          # 제어 기준점(TCP)의 URDF 프레임 이름 (link_6 에서 0.185 m)
home_joints_deg: [0.0, 0.0, 90.0, 0.0, 90.0, 0.0]   # 홈 자세 (deg). 모든 관절 0 은 위로 펴진 특이 자세라 피함

# ---- 팔 형태 유지 (IK 가 엉뚱한 자세로 점프하지 않도록) ----
# 아래 관절의 부호가 홈 자세와 다른 IK 해는 버린다. joint_3: 팔꿈치, joint_5: 손목 뒤집힘
# (추가로 joint_1 이 목표 방향에서 90 deg 넘게 벗어난 해, 즉 팔을 뒤로 뻗는 해도 버린다)
branch_joints: [joint_3, joint_5]

# ---- 큐브 (task 시작 시 생성) ----
cube_size: [0.0515, 0.0515, 0.0515]          # 큐브 크기 (m)
cube_initial_position: [0.45, 0.20, 0.02575] # 큐브 처음 위치 (m), z 는 바닥 위에 놓이도록 크기의 절반

# ---- 장애물 (run_pick_place_rrt.py 에서만 사용) ----
# 박스 중심 위치(m) 와 크기(m). 장면에 실제 벽으로 만들고, RRT 에는 obstacle_margin 만큼 키운 박스를 준다.
# 주의: 장애물을 피하는 것은 rrt 이동뿐이다. linear 이동(하강/상승)은 충돌 검사를 하지 않으므로
#       집기/놓기 자세 근처의 팔이 지나가는 곳에는 두지 말 것 (높이 0.4 m 벽은 하강 중 전완(link_4)에 닿았음)
obstacles:
  - {name: wall, position: [0.45, -0.12, 0.15], size: [0.3, 0.03, 0.3]}   # 큐브와 놓을 위치 사이의 벽
obstacle_margin: 0.04              # RRT 가 보는 장애물 여유 (m). 그리퍼 아래에 매달린 큐브 공간도 이것으로 확보

# ---- 시뮬레이션 주기 ----
physics_dt: 0.0083333333           # 물리 계산 주기 (s) = 1/120
rendering_dt: 0.0166666667         # 렌더링 주기 (s) = 1/60. 컨트롤러는 렌더링 1번에 1번 호출됨

# ===================================================================
# [실행 중 반영 영역]
# 시뮬레이션 실행 중에 이 파일을 저장하면 다음 프레임부터 반영된다.
# ===================================================================

# ---- 그리퍼 ----
gripper_angle: 1.0       # run_follow_target.py 전용: 손가락 목표 각도 (rad), 0.0(열림) ~ 1.10(닫힘)
gripper_open: 0.0        # pick and place 에서 열 때 손가락 각도 (rad)
gripper_closed: 1.0      # pick and place 에서 닫을 때 손가락 각도 (rad). 큐브를 잡으면 약 0.70 에서 멈춤

# ---- pick and place 위치와 자세 ----
place_position: [0.45, -0.25, 0.02575]       # 큐브를 놓을 위치 (큐브 중심, m)
end_effector_offset: [0.0, 0.0, 0.015]       # 큐브 중심 대비 TCP 목표 보정 (m). z > 0: 닫힐 때 손가락 끝이 바닥에 걸리지 않게
end_effector_initial_height: 0.30            # 큐브 위로 접근하고 옮길 때의 TCP 높이 (m)
grasp_euler_deg: [0.0, 180.0, 0.0]           # 집을 때 TCP 자세 (deg). TCP z 축이 아래를 향함

# ---- 단계별 이동 방식 (run_pick_place.py) ----
#   ik     : 목표점을 조금씩 옮기며 IK 로 따라감 (장애물 회피 없음)
#   linear : TCP 가 직선으로 이동하는 trajectory (장애물 회피 없음)
motion_modes:
  above_cube: ik         # 큐브 위로 이동
  descend: linear        # 큐브까지 하강
  lift: linear           # 큐브를 들고 상승
  carry: ik              # 놓을 위치 위로 이동
  lower: linear          # 놓을 위치로 하강
  up: linear             # 놓은 뒤 상승
  return: ik             # 시작 위치로 복귀

# ---- 단계별 이동 방식 (run_pick_place_rrt.py) ----
#   rrt    : Lula RRT 로 장애물을 돌아가는 경로를 찾아 이동
rrt_motion_modes:
  above_cube: rrt
  descend: linear
  lift: linear
  carry: rrt
  lower: linear
  up: linear
  return: rrt

# ---- 이동 속도와 도착 판정 ----
max_joint_step: 0.02          # ik: 한 번 호출에 관절이 움직일 수 있는 최대 각도 (rad). 클수록 빠름
target_step: 0.004            # ik: 목표점이 한 번 호출에 이동하는 거리 (m). 60 Hz 에서 0.24 m/s
trajectory_speed_scale: 0.3   # linear / rrt: 관절 속도·가속도 한계(URDF / 로봇 설명 파일)에 곱하는 비율. 작을수록 느리고 정확
position_tolerance: 0.01      # TCP 가 목표에서 이 거리 안이면 도착으로 판정 (m)
stuck_frames: 120             # 이동 명령이 끝난 뒤 이 횟수만큼 지나도 도착하지 못하면 다음 단계로 넘어감 (막힘 대비)
settle_frames: 10             # 큐브 위에서 그리퍼를 닫기 전에 기다리는 호출 횟수

# ---- 그리퍼 동작 완료 판정 (손가락이 멈추면 완료) ----
gripper_still: 0.005          # 아래 구간 동안 손가락 각도 변화가 이 값(rad)보다 작으면 멈춘 것으로 판정
gripper_still_frames: 20      # 손가락 멈춤을 판단하는 구간 길이 (호출 횟수)
gripper_max_frames: 180       # 손가락이 멈추지 않아도 이 횟수가 지나면 다음 단계로 넘어감

# ---- RRT (run_pick_place_rrt.py) ----
rrt_max_iterations: 10000     # RRT 탐색 최대 반복 횟수. 계획하는 동안 시뮬레이션이 멈춤
rrt_interpolation_step: 0.05  # RRT 경로점 사이 최대 관절 변화 (rad). 작을수록 검사한 경로에 가깝지만 느려짐 (0.01 이면 약 4배 느림)
rrt_attempts: 10              # seed 를 바꿔 계획하는 횟수. 팔 형태를 유지하는 경로 중 가장 짧은 것을 씀 (많을수록 좋은 경로, 계획 시간 증가)
rrt_retry_frames: 60          # 경로를 못 찾으면 제자리에서 기다렸다가 이 횟수 뒤에 다시 계획
