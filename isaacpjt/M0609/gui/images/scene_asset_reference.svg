<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" width="720" height="590">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
    </style>
    <marker id="arrow-purple-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2a1a5a"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0a2a3a"/>
    </marker>
    <!-- 링크(체인) 아이콘 -->
    <g id="chain">
      <rect x="-13" y="-5" width="16" height="10" rx="5" fill="#fffaf0" stroke="#2a1a5a" stroke-width="1.8"/>
      <rect x="-3" y="-5" width="16" height="10" rx="5" fill="none" stroke="#2a1a5a" stroke-width="1.8"/>
    </g>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="720" height="590" fill="#fffaf0"/>

  <!-- 제목 -->
  <text x="24" y="34" font-size="16" font-weight="500" fill="#0a0a0a">씬에 보이는 로봇과 큐브는 링크다</text>
  <text x="24" y="54" font-size="12" fill="#6a6a6a">실제 파일은 자산 폴더에 있고, 씬 파일에는 "어디에 있는지" 경로만 저장된다</text>

  <!-- ===== Isaac Sim 창 ===== -->
  <rect x="24" y="76" width="400" height="300" rx="10" fill="#fffaf0" stroke="#5a9ab0" stroke-width="1.5"/>
  <path d="M24 104 V86 A10 10 0 0 1 34 76 H414 A10 10 0 0 1 424 86 V104 Z" fill="#93c5d4"/>
  <circle cx="40" cy="90" r="4" fill="#fffaf0"/>
  <circle cx="53" cy="90" r="4" fill="#fffaf0"/>
  <circle cx="66" cy="90" r="4" fill="#fffaf0"/>
  <text x="82" y="95" font-size="12" font-weight="500" fill="#0a2a3a">Isaac Sim · scenes/pick_place_cube.usd</text>

  <!-- 바닥 (GroundPlane) -->
  <polygon points="44,362 404,362 368,268 80,268" fill="#f1ede4" stroke="#e5e5e5" stroke-width="1"/>
  <line x1="62" y1="315" x2="386" y2="315" stroke="#e5e5e5" stroke-width="1"/>
  <line x1="224" y1="268" x2="224" y2="362" stroke="#e5e5e5" stroke-width="1"/>
  <text x="56" y="355" font-size="11" fill="#6a6a6a">GroundPlane</text>

  <!-- World 라벨 -->
  <rect x="36" y="114" width="52" height="20" rx="4" fill="#93c5d4"/>
  <text x="62" y="128" font-size="12" font-weight="500" fill="#0a2a3a" text-anchor="middle">World</text>

  <!-- 로봇 (M0609 + RG2 + D455) -->
  <rect x="146" y="318" width="52" height="24" rx="5" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="160" y="226" width="24" height="96" rx="11" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.5"/>
  <rect x="172" y="216" width="112" height="26" rx="12" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="172" cy="229" r="15" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="172" cy="229" r="5" fill="#6a6a6a"/>
  <rect x="272" y="226" width="22" height="54" rx="9" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="283" cy="229" r="13" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="283" cy="229" r="4" fill="#6a6a6a"/>
  <rect x="294" y="248" width="16" height="11" rx="2" fill="#6a6a6a"/>
  <rect x="266" y="280" width="34" height="8" rx="2" fill="#6a6a6a"/>
  <rect x="268" y="288" width="6" height="18" rx="2" fill="#6a6a6a"/>
  <rect x="292" y="288" width="6" height="18" rx="2" fill="#6a6a6a"/>
  <text x="104" y="210" font-size="12" font-weight="500" fill="#0a0a0a">m0609_rg2_d455</text>

  <!-- 큐브 (red_block) -->
  <polygon points="318,318 330,308 362,308 350,318" fill="#fbc7e3" stroke="#e07aaa" stroke-width="1.2"/>
  <polygon points="350,318 362,308 362,340 350,350" fill="#e992c0" stroke="#e07aaa" stroke-width="1.2"/>
  <rect x="318" y="318" width="32" height="32" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1.2"/>
  <text x="318" y="298" font-size="12" font-weight="500" fill="#5a0a2a">red_block</text>

  <!-- ===== 자산 폴더 ===== -->
  <!-- robot/ 폴더 -->
  <path d="M500 112 V104 A6 6 0 0 1 506 98 H566 L578 110 H690 A6 6 0 0 1 696 116 V220 A6 6 0 0 1 690 226 H506 A6 6 0 0 1 500 220 Z" fill="#d6d1ff" stroke="#a090e0" stroke-width="1"/>
  <text x="512" y="132" font-size="14" font-weight="500" fill="#2a1a5a">robot/</text>
  <text x="512" y="150" font-size="12" fill="#2a1a5a" opacity="0.75">m0609_rg2_d455.usd</text>
  <!-- 폴더 안 실제 로봇 -->
  <rect x="640" y="204" width="28" height="12" rx="3" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="647" y="162" width="13" height="44" rx="6" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="653" y="157" width="36" height="13" rx="6" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.2"/>
  <circle cx="653" cy="164" r="7" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="679" y="164" width="10" height="24" rx="4" fill="#fffaf0" stroke="#0a0a0a" stroke-width="1.2"/>
  <rect x="676" y="188" width="16" height="4" rx="1" fill="#6a6a6a"/>
  <text x="512" y="212" font-size="11" fill="#2a1a5a" opacity="0.75">실제 로봇 파일</text>

  <!-- props/red_block/ 폴더 -->
  <path d="M500 284 V276 A6 6 0 0 1 506 270 H566 L578 282 H690 A6 6 0 0 1 696 288 V392 A6 6 0 0 1 690 398 H506 A6 6 0 0 1 500 392 Z" fill="#d6d1ff" stroke="#a090e0" stroke-width="1"/>
  <text x="512" y="304" font-size="14" font-weight="500" fill="#2a1a5a">props/red_block/</text>
  <text x="512" y="322" font-size="12" fill="#2a1a5a" opacity="0.75">red_block.usd</text>
  <!-- 폴더 안 실제 큐브 -->
  <polygon points="636,344 646,336 672,336 662,344" fill="#fbc7e3" stroke="#e07aaa" stroke-width="1.2"/>
  <polygon points="662,344 672,336 672,362 662,370" fill="#e992c0" stroke="#e07aaa" stroke-width="1.2"/>
  <rect x="636" y="344" width="26" height="26" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1.2"/>
  <text x="512" y="384" font-size="11" fill="#2a1a5a" opacity="0.75">실제 큐브 파일</text>

  <!-- ===== 씬 파일 내용 ===== -->
  <rect x="24" y="420" width="672" height="150" rx="10" fill="#fffaf0" stroke="#e5e5e5" stroke-width="1"/>
  <!-- 문서 아이콘 -->
  <path d="M44 440 H82 L98 456 V526 H44 Z" fill="#fffaf0" stroke="#0a2a3a" stroke-width="1.3"/>
  <path d="M82 440 V456 H98" fill="none" stroke="#0a2a3a" stroke-width="1.3"/>
  <line x1="54" y1="472" x2="88" y2="472" stroke="#93c5d4" stroke-width="2"/>
  <line x1="54" y1="484" x2="88" y2="484" stroke="#93c5d4" stroke-width="2"/>
  <line x1="54" y1="496" x2="80" y2="496" stroke="#93c5d4" stroke-width="2"/>
  <text x="71" y="546" font-size="11" fill="#6a6a6a" text-anchor="middle">.usd</text>

  <text x="118" y="446" font-size="14" font-weight="500" fill="#0a0a0a">씬 파일에 실제로 저장되는 것</text>
  <text x="118" y="474" font-size="13" fill="#0a0a0a">World</text>
  <text x="130" y="498" font-size="13" fill="#0a0a0a">├ m0609_rg2_d455</text>
  <use href="#chain" x="276" y="494"/>
  <text x="298" y="498" font-size="13" fill="#2a1a5a">../robot/m0609_rg2_d455.usd</text>
  <text x="130" y="522" font-size="13" fill="#0a0a0a">├ GroundPlane</text>
  <text x="298" y="522" font-size="12" fill="#6a6a6a">씬에서 직접 만든 바닥</text>
  <text x="130" y="546" font-size="13" fill="#0a0a0a">└ red_block</text>
  <use href="#chain" x="276" y="542"/>
  <text x="298" y="546" font-size="13" fill="#2a1a5a">../props/red_block/red_block.usd</text>
  <text x="680" y="474" font-size="12" fill="#6a6a6a" text-anchor="end">로봇·큐브 본체는 들어 있지 않다</text>

  <!-- ===== 연결선 (맨 마지막) ===== -->
  <!-- 로봇 → robot/ 폴더 -->
  <path d="M228 216 V162 H500" fill="none" stroke="#2a1a5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-purple-dark)"/>
  <use href="#chain" x="462" y="162"/>
  <text x="462" y="150" font-size="12" font-weight="500" fill="#2a1a5a" text-anchor="middle">링크</text>
  <!-- 큐브 → props/ 폴더 -->
  <path d="M362 330 H500" fill="none" stroke="#2a1a5a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-purple-dark)"/>
  <use href="#chain" x="462" y="330"/>
  <text x="462" y="318" font-size="12" font-weight="500" fill="#2a1a5a" text-anchor="middle">링크</text>
  <!-- 창 → 씬 파일 저장 -->
  <path d="M224 376 V420" fill="none" stroke="#0a2a3a" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
  <text x="234" y="403" font-size="12" font-weight="500" fill="#0a2a3a">File &gt; Save</text>
</svg>
