<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
    </style>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0a0a0a"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#0a2a3a"/>
    </marker>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="720" height="380" fill="#fffaf0"/>

  <!-- 제목 -->
  <text x="360" y="36" font-size="16" font-weight="500" fill="#0a0a0a" text-anchor="middle">토픽으로 로봇팔 움직이기</text>

  <!-- ROS2 터미널 -->
  <rect x="24" y="96" width="176" height="150" rx="12" fill="#d6d1ff" stroke="#a090e0" stroke-width="1"/>
  <text x="112" y="128" font-size="15" font-weight="500" fill="#2a1a5a" text-anchor="middle">ROS2 터미널</text>
  <text x="112" y="148" font-size="12" fill="#2a1a5a" opacity="0.75" text-anchor="middle">새 터미널 (ros_set)</text>
  <text x="112" y="182" font-size="12" fill="#2a1a5a" text-anchor="middle">ros2 topic pub --once</text>
  <text x="112" y="200" font-size="12" fill="#2a1a5a" text-anchor="middle">/arm_command</text>
  <text x="112" y="218" font-size="12" fill="#2a1a5a" text-anchor="middle">"{data: left}"</text>

  <!-- 토픽 -->
  <rect x="236" y="110" width="150" height="74" rx="10" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1.5"/>
  <text x="311" y="138" font-size="15" font-weight="500" fill="#5a0a2a" text-anchor="middle">/arm_command</text>
  <text x="311" y="158" font-size="12" fill="#5a0a2a" text-anchor="middle">std_msgs/String</text>
  <text x="311" y="175" font-size="12" fill="#5a0a2a" opacity="0.75" text-anchor="middle">data: "left"</text>
  <text x="218" y="138" font-size="11" fill="#6a6a6a" text-anchor="middle">발행</text>
  <text x="404" y="138" font-size="11" fill="#6a6a6a" text-anchor="middle">구독</text>

  <!-- Isaac Sim -->
  <rect x="422" y="60" width="274" height="300" rx="12" fill="#93c5d4" stroke="#5a9ab0" stroke-width="1"/>
  <text x="559" y="88" font-size="15" font-weight="500" fill="#0a2a3a" text-anchor="middle">Isaac Sim</text>
  <text x="559" y="106" font-size="12" fill="#0a2a3a" opacity="0.75" text-anchor="middle">R3_subscribe.py</text>

  <rect x="438" y="122" width="242" height="54" rx="8" fill="#fffaf0" stroke="#e5e5e5" stroke-width="0.5"/>
  <text x="452" y="145" font-size="13" font-weight="500" fill="#0a0a0a">① rclpy.spin_once()</text>
  <text x="452" y="164" font-size="12" fill="#6a6a6a">도착한 메시지를 꺼낸다</text>

  <rect x="438" y="202" width="242" height="54" rx="8" fill="#fffaf0" stroke="#e5e5e5" stroke-width="0.5"/>
  <text x="452" y="225" font-size="13" font-weight="500" fill="#0a0a0a">② on_command() 콜백</text>
  <text x="452" y="244" font-size="12" fill="#6a6a6a">목표만 저장: target_deg = 45</text>

  <rect x="438" y="282" width="242" height="54" rx="8" fill="#fffaf0" stroke="#e5e5e5" stroke-width="0.5"/>
  <text x="452" y="305" font-size="13" font-weight="500" fill="#0a0a0a">③ 메인 루프 apply_action()</text>
  <text x="452" y="324" font-size="12" fill="#6a6a6a">joint_1 을 45 deg 로 움직인다</text>

  <!-- 연결선 (맨 마지막) -->
  <path d="M200 147 H234" fill="none" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <path d="M386 147 H436" fill="none" stroke="#0a0a0a" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <path d="M559 176 V200" fill="none" stroke="#0a2a3a" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
  <path d="M559 256 V280" fill="none" stroke="#0a2a3a" stroke-width="1.5" marker-end="url(#arrow-navy)"/>
</svg>
