<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 720 830" width="720" height="830">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
    </style>
  </defs>

  <!-- 배경 -->
  <rect x="0" y="0" width="720" height="830" fill="#fffaf0"/>

  <!-- 제목 -->
  <text x="24" y="34" font-size="16" font-weight="500" fill="#0a0a0a">Action Graph 와 og.Controller.edit 코드는 1:1 로 대응한다</text>
  <text x="24" y="54" font-size="12" fill="#6a6a6a">같은 색끼리 같은 것: 노드 = CREATE_NODES, 연결선 = CONNECT, 입력값 = SET_VALUES</text>

  <!-- ===== 위: Action Graph 캡처 + 표시 ===== -->
  <g transform="translate(24,72) scale(0.80672)">
    <image x="0" y="0" width="833" height="569" xlink:href="R1_action_graph.png"/>

    <!-- 노드 테두리 + 코드 속 노드 이름 (CREATE_NODES) -->
    <rect x="152" y="36" width="197" height="150" rx="8" fill="none" stroke="#93c5d4" stroke-width="3"/>
    <rect x="152" y="6" width="150" height="26" rx="5" fill="#93c5d4"/>
    <text x="227" y="24" font-size="15" font-weight="500" fill="#0a2a3a" text-anchor="middle">OnPlaybackTick</text>

    <rect x="152" y="223" width="196" height="130" rx="8" fill="none" stroke="#93c5d4" stroke-width="3"/>
    <rect x="152" y="193" width="90" height="26" rx="5" fill="#93c5d4"/>
    <text x="197" y="211" font-size="15" font-weight="500" fill="#0a2a3a" text-anchor="middle">Context</text>

    <rect x="152" y="390" width="221" height="150" rx="8" fill="none" stroke="#93c5d4" stroke-width="3"/>
    <rect x="152" y="360" width="130" height="26" rx="5" fill="#93c5d4"/>
    <text x="217" y="378" font-size="15" font-weight="500" fill="#0a2a3a" text-anchor="middle">ReadSimTime</text>

    <rect x="596" y="250" width="216" height="215" rx="8" fill="none" stroke="#93c5d4" stroke-width="3"/>
    <rect x="596" y="220" width="130" height="26" rx="5" fill="#93c5d4"/>
    <text x="661" y="238" font-size="15" font-weight="500" fill="#0a2a3a" text-anchor="middle">PublishClock</text>

    <!-- 연결선 번호 (CONNECT) -->
    <circle cx="478" cy="196" r="15" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1.5"/>
    <text x="478" y="202" font-size="16" font-weight="500" fill="#5a0a2a" text-anchor="middle">1</text>
    <circle cx="470" cy="310" r="15" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1.5"/>
    <text x="470" y="316" font-size="16" font-weight="500" fill="#5a0a2a" text-anchor="middle">2</text>
    <circle cx="490" cy="492" r="15" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1.5"/>
    <text x="490" y="498" font-size="16" font-weight="500" fill="#5a0a2a" text-anchor="middle">3</text>

    <!-- Topic Name 입력값 (SET_VALUES) -->
    <rect x="600" y="434" width="82" height="20" rx="4" fill="none" stroke="#ffb83e" stroke-width="3"/>
    <rect x="600" y="480" width="210" height="30" rx="5" fill="#ffb83e" stroke="#c07a00" stroke-width="0.8"/>
    <text x="705" y="501" font-size="15" font-weight="500" fill="#3a2000" text-anchor="middle">topicName = "clock"</text>
    <path d="M641 454 V480" fill="none" stroke="#c07a00" stroke-width="2"/>
  </g>

  <!-- ===== 아래: 코드 ===== -->
  <text x="24" y="562" font-size="13" font-weight="500" fill="#0a0a0a">R1_clock.py 의 og.Controller.edit (코드)</text>
  <rect x="24" y="574" width="672" height="238" rx="10" fill="#fffaf0" stroke="#e5e5e5" stroke-width="1"/>

  <text x="40" y="598" font-size="12" fill="#6a6a6a">og.Controller.edit({"graph_path": "/World/Graph/ROS_Clock", "evaluator_name": "execution"}, {</text>

  <!-- CREATE_NODES -->
  <rect x="40" y="606" width="5" height="82" rx="2" fill="#93c5d4"/>
  <text x="56" y="620" font-size="12" font-weight="500" fill="#0a2a3a">CREATE_NODES: [ (이름, 노드 타입) ]</text>
  <text x="72" y="637" font-size="12" fill="#0a0a0a">("OnPlaybackTick", "omni.graph.action.OnPlaybackTick"),</text>
  <text x="72" y="653" font-size="12" fill="#0a0a0a">("Context", "isaacsim.ros2.bridge.ROS2Context"),</text>
  <text x="72" y="669" font-size="12" fill="#0a0a0a">("ReadSimTime", "isaacsim.core.nodes.IsaacReadSimulationTime"),</text>
  <text x="72" y="685" font-size="12" fill="#0a0a0a">("PublishClock", "isaacsim.ros2.bridge.ROS2PublishClock"),</text>

  <!-- CONNECT -->
  <rect x="40" y="698" width="5" height="70" rx="2" fill="#f9a8d4"/>
  <text x="56" y="712" font-size="12" font-weight="500" fill="#5a0a2a">CONNECT: [ (출력 포트, 입력 포트) ]</text>
  <circle cx="80" cy="725" r="7" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1"/>
  <text x="80" y="729" font-size="10" font-weight="500" fill="#5a0a2a" text-anchor="middle">1</text>
  <text x="94" y="729" font-size="12" fill="#0a0a0a">("OnPlaybackTick.outputs:tick", "PublishClock.inputs:execIn"),</text>
  <circle cx="80" cy="741" r="7" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1"/>
  <text x="80" y="745" font-size="10" font-weight="500" fill="#5a0a2a" text-anchor="middle">2</text>
  <text x="94" y="745" font-size="12" fill="#0a0a0a">("Context.outputs:context", "PublishClock.inputs:context"),</text>
  <circle cx="80" cy="757" r="7" fill="#f9a8d4" stroke="#e07aaa" stroke-width="1"/>
  <text x="80" y="761" font-size="10" font-weight="500" fill="#5a0a2a" text-anchor="middle">3</text>
  <text x="94" y="761" font-size="12" fill="#0a0a0a">("ReadSimTime.outputs:simulationTime", "PublishClock.inputs:timeStamp"),</text>

  <!-- SET_VALUES -->
  <rect x="40" y="778" width="5" height="22" rx="2" fill="#ffb83e"/>
  <text x="56" y="794" font-size="12" font-weight="500" fill="#3a2000">SET_VALUES:</text>
  <text x="140" y="794" font-size="12" fill="#0a0a0a">[ ("PublishClock.inputs:topicName", "clock") ]</text>
</svg>
